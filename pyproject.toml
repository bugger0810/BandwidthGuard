[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bandwidthguard"
dynamic = ["version"]
description = "Limit and monitor the bandwidth of individual programs on Windows"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "bugger0810" }]
requires-python = ">=3.10"
dependencies = ["PySide6>=6.6", "psutil>=5.9", "pydivert>=2.1.0"]
classifiers = [
    "Operating System :: Microsoft :: Windows",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/bugger0810/BandwidthGuard"
Issues = "https://github.com/bugger0810/BandwidthGuard/issues"

[project.gui-scripts]
bandwidthguard = "bandwidthguard.app:main"

[tool.setuptools.dynamic]
version = { attr = "bandwidthguard.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bandwidthguard = ["locales/*.json", "assets/*"]
