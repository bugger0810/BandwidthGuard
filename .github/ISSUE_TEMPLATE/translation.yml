name: Translation fix / new language
description: Correct a translation or ask for a new language
labels: [translation]
body:
  - type: input
    id: language
    attributes:
      label: Language
      placeholder: e.g. Português (Portugal)
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What should change?
      description: Quote the text and your suggestion. Pull requests are even better – see CONTRIBUTING.md.
    validations:
      required: true
