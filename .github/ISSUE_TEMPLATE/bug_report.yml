name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: BandwidthGuard version
      description: Shown in the About dialog (ⓘ button).
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: Windows 11 23H2
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Program you tried to limit, antivirus software, screenshots, error messages ...
