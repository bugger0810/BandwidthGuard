name: Build & Release

# Creates the Windows installer automatically.
#   * Push a tag such as v1.0.0  -> builds Setup.exe and attaches it to a GitHub Release
#   * "Run workflow" button      -> builds Setup.exe and offers it as a downloadable artifact
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write   # needed to create the release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Check translations and run tests
        run: |
          python tools/check_locales.py
          python -m pytest -q

      - name: Build the program (PyInstaller)
        run: python tools/build.py

      - name: Build the installer (Inno Setup)
        shell: pwsh
        run: |
          $version = python -c "import sys; sys.path.insert(0,'src'); import bandwidthguard; print(bandwidthguard.__version__)"
          Write-Host "Version: $version"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" installer\BandwidthGuard.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload installer as artifact
        uses: actions/upload-artifact@v4
        with:
          name: BandwidthGuard-Setup
          path: installer/Output/*.exe

      - name: Attach installer to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/*.exe
          generate_release_notes: true
